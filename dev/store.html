<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Patakha store graphics</title>
  <link rel="stylesheet" href="../css/fonts.css" />
  <style>
    body { margin: 0; background: #222; color: #fff; font-family: 'Barlow', sans-serif; display: grid; gap: 24px; padding: 24px; justify-items: start; }
    #icon { width: 512px; height: 512px; display: block; }
    #feature { position: relative; width: 1024px; height: 500px; overflow: hidden; background: #05030b; }
    #feature canvas { position: absolute; inset: 0; width: 1024px; height: 500px; }
    .fg-text { position: absolute; left: 56px; top: 96px; display: grid; gap: 6px; }
    .fg-row { display: flex; align-items: center; gap: 18px; }
    .fg-row svg { width: 104px; height: 104px; filter: drop-shadow(0 0 20px rgba(255,182,39,.55)); }
    .fg-name { font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 84px; letter-spacing: .14em; line-height: .9; text-shadow: 0 4px 24px rgba(0,0,0,.8); }
    .fg-hi { font-family: 'Yatra One', sans-serif; color: #ffb627; font-size: 34px; line-height: 1; margin-top: 4px; }
    .fg-sub { font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 26px; letter-spacing: .2em; text-transform: uppercase; color: #ffe9c4; margin-top: 18px; text-shadow: 0 2px 12px #000; }
    .fg-by { font-family: 'Share Tech Mono', monospace; font-size: 17px; letter-spacing: .2em; text-transform: uppercase; color: #bcaec8; margin-top: 8px; }
    .fg-by b { color: #fff; font-weight: 400; }
  </style>
</head>
<body>
  <p>Store graphics: these are screenshotted to <code>store/</code> (see <code>scripts/store-graphics.mjs</code>).</p>
  <img id="icon" src="../icons/icon.svg" alt="icon" />
  <div id="feature">
    <canvas id="sky"></canvas><canvas id="props"></canvas><canvas id="fx"></canvas>
    <div class="fg-text">
      <div class="fg-row">
        <svg viewBox="0 0 64 64"><use href="#mark"/></svg>
        <div><div class="fg-name">PATAKHA</div><div class="fg-hi">पटाखा · शुभ दीपावली</div></div>
      </div>
      <div class="fg-sub">Diwali Crackers Simulator</div>
      <div class="fg-by">Sound · Vibration · Flashlight &nbsp;|&nbsp; by <b>ARTIN Studios</b></div>
    </div>
  </div>
  <svg width="0" height="0" style="position:absolute"><defs>
    <linearGradient id="mk-coat" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e2611c"/><stop offset=".6" stop-color="#ffb627"/><stop offset="1" stop-color="#ffe7a0"/></linearGradient>
      <radialGradient id="mk-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6d8"/><stop offset=".35" stop-color="#ffd36b" stop-opacity=".8"/><stop offset="1" stop-color="#ffb627" stop-opacity="0"/></radialGradient>
    <radialGradient id="mk-bg" cx=".5" cy=".42" r=".7"><stop offset="0" stop-color="#3a1640"/><stop offset="1" stop-color="#0b0614"/></radialGradient>
    <symbol id="mark" viewBox="0 0 64 64">
        <path d="M32 4 L56 12 V31 C56 45 46 54 32 60 C18 54 8 45 8 31 V12 Z" fill="url(#mk-bg)"/>
        <path d="M32 4 L56 12 V31 C56 45 46 54 32 60 C18 54 8 45 8 31 V12 Z" fill="none" stroke="#ffb627" stroke-width="2.4" stroke-linejoin="round"/>
        <g><path d="M17.5 50 L20.74 42.56" stroke="#b9b2a6" stroke-width="1.6" stroke-linecap="round"/><path d="M20.74 42.56 L31 19" stroke="url(#mk-coat)" stroke-width="4.3" stroke-linecap="round"/><path d="M46.5 50 L43.26 42.56" stroke="#b9b2a6" stroke-width="1.6" stroke-linecap="round"/><path d="M43.26 42.56 L33 19" stroke="url(#mk-coat)" stroke-width="4.3" stroke-linecap="round"/></g>
        <g><path d="M21.5 40 Q27 37 32 39.5 T42.5 39" fill="none" stroke="#ffb627" stroke-width="3.6" stroke-linecap="round" opacity=".35"/><path d="M21.5 40 Q27 37 32 39.5 T42.5 39" fill="none" stroke="#fff0c8" stroke-width="1.7" stroke-linecap="round"/></g>
        <g><circle cx="32" cy="16.5" r="8.80" fill="url(#mk-glow)"/><path d="M32.00 15.06 L32.00 8.50" stroke="#fff3c9" stroke-width="1" stroke-linecap="round"/><circle cx="32.00" cy="6.90" r=".55" fill="#ffd36b"/><path d="M32.55 15.17 L33.68 12.43" stroke="#fff3c9" stroke-width="0.7" stroke-linecap="round"/><path d="M33.02 15.48 L37.66 10.84" stroke="#fff3c9" stroke-width="1" stroke-linecap="round"/><circle cx="38.79" cy="9.71" r=".55" fill="#ffd36b"/><path d="M33.33 15.95 L36.07 14.82" stroke="#fff3c9" stroke-width="0.7" stroke-linecap="round"/><path d="M33.44 16.50 L40.00 16.50" stroke="#fff3c9" stroke-width="1" stroke-linecap="round"/><circle cx="41.60" cy="16.50" r=".55" fill="#ffd36b"/><path d="M33.33 17.05 L36.07 18.18" stroke="#fff3c9" stroke-width="0.7" stroke-linecap="round"/><path d="M33.02 17.52 L37.66 22.16" stroke="#fff3c9" stroke-width="1" stroke-linecap="round"/><circle cx="38.79" cy="23.29" r=".55" fill="#ffd36b"/><path d="M32.55 17.83 L33.68 20.57" stroke="#fff3c9" stroke-width="0.7" stroke-linecap="round"/><path d="M32.00 17.94 L32.00 24.50" stroke="#fff3c9" stroke-width="1" stroke-linecap="round"/><circle cx="32.00" cy="26.10" r=".55" fill="#ffd36b"/><path d="M31.45 17.83 L30.32 20.57" stroke="#fff3c9" stroke-width="0.7" stroke-linecap="round"/><path d="M30.98 17.52 L26.34 22.16" stroke="#fff3c9" stroke-width="1" stroke-linecap="round"/><circle cx="25.21" cy="23.29" r=".55" fill="#ffd36b"/><path d="M30.67 17.05 L27.93 18.18" stroke="#fff3c9" stroke-width="0.7" stroke-linecap="round"/><path d="M30.56 16.50 L24.00 16.50" stroke="#fff3c9" stroke-width="1" stroke-linecap="round"/><circle cx="22.40" cy="16.50" r=".55" fill="#ffd36b"/><path d="M30.67 15.95 L27.93 14.82" stroke="#fff3c9" stroke-width="0.7" stroke-linecap="round"/><path d="M30.98 15.48 L26.34 10.84" stroke="#fff3c9" stroke-width="1" stroke-linecap="round"/><circle cx="25.21" cy="9.71" r=".55" fill="#ffd36b"/><path d="M31.45 15.17 L30.32 12.43" stroke="#fff3c9" stroke-width="0.7" stroke-linecap="round"/><circle cx="32" cy="16.5" r="1.4" fill="#fff"/></g>
      </symbol>
  </defs></svg>
  <script type="module">
    // Paints a frozen moment of the real scene: the app's own sky, crackers and sparks,
    // stepped frame by frame so the picture always matches the app.
    import { Scene } from '../js/scene.js';
    import { Sparks } from '../js/fx.js';
    import { VISUALS, burst } from '../js/visuals.js';
    import { byId } from '../js/crackers.js';
    import { rng } from '../js/synth.js';
    const W = 1024, H = 500, dpr = 2;
    const scene = new Scene(document.getElementById('sky'), document.getElementById('props'));
    const sparks = new Sparks(document.getElementById('fx'));
    scene.resize(W, H, dpr, 40); sparks.resize(W, H, dpr);
    const st = { scene, sparks, flash() {}, shake() {} };
    const now = performance.now();
    const make = (id, x, y, t) => { const d = byId[id]; return new VISUALS[d.kind](st, d.plan(rng(42 + x)), x, y, now - t * 1000); };
    const anar = make('anar', 760, 430, 4), anar2 = make('anar', 930, 445, 3.2), chakri = make('chakri', 850, 470, 3);
    const list = [anar, anar2, chakri];
    for (let f = 0; f < 120; f++) {
      if (f === 40) burst(st, 700, 120, { type: 'peony', colour: 'violet', colour2: 'gold', size: 0.75 });
      if (f === 60) burst(st, 930, 90, { type: 'willow', colour: 'gold', size: 0.7 });
      if (f === 75) burst(st, 560, 70, { type: 'peony', colour: 'green', size: 0.55 }, { scale: 0.6, alpha: 0.8 });
      for (const v of list) v.update(1 / 60);
      scene.beginFrame(now + f * 16);
      for (const v of list) v.draw(scene.pc);
      sparks.update(1 / 60); sparks.draw(1 / 60);
    }
    // dark veil behind the text
    const c = scene.pc, g = c.createLinearGradient(0, 0, 640, 0);
    g.addColorStop(0, 'rgba(5,3,11,0.75)'); g.addColorStop(1, 'rgba(5,3,11,0)');
    c.globalCompositeOperation = 'source-over'; c.fillStyle = g; c.fillRect(0, 0, 640, H);
    document.body.dataset.ready = '1';
  </script>
</body>
</html>
